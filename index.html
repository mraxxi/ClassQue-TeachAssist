<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before first paint (cq_theme cookie: light | dark | system).
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)cq_theme=([^;]*)/);
          var pref = m ? decodeURIComponent(m[1]) : 'system';
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f766e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z'/><path d='M6 6h10'/><path d='M6 10h10'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassQue TeachAssist — Educator Operating System</title>
    <meta name="description" content="Centralized single-panel personal operating system for teachers to manage cohorts, live class stopwatch, roll-call attendance, CEFR grading, claims, and parent reporting." />
  </head>
  <body class="h-full bg-(--app-bg) text-(--app-fg) antialiased selection:bg-teal-100 selection:text-teal-900 font-sans">
    <div id="root" class="h-full"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML = '<div style="padding: 20px; background: white; color: red; z-index: 9999; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: auto;"><h1>Global Error Caught</h1><pre>' + message + '\n' + (error && error.stack ? error.stack : '') + '</pre></div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="padding: 20px; background: white; color: red; z-index: 9999; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: auto;"><h1>Unhandled Promise Rejection</h1><pre>' + event.reason + '\n' + (event.reason && event.reason.stack ? event.reason.stack : '') + '</pre></div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
